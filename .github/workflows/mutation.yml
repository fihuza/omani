name: Mutation

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: What the shell layer does not notice
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed git jq mise

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          mise trust --yes
          mise install
          echo "$HOME/.local/share/mise/shims" >>"$GITHUB_PATH"

      - name: Mutate bin/omani
        run: ./scripts/mutate shell

  views:
    name: What the views do not notice
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: |
          # Qt 6.12's qmllint dies while importing Quickshell.Services.Mpris:
          # exit 255 and not a word of output, which takes the QML gates with it.
          # The container is pinned to the last Arch snapshot before 6.12 landed
          # on 2026-10-01, so the gates keep running against 6.11.2. -Syuu
          # because the image ships newer packages than the snapshot. Lift this
          # once a fixed qmllint is in extra.
          printf 'Server=https://archive.archlinux.org/repos/2026/09/28/$repo/os/$arch\n' \
            >/etc/pacman.d/mirrorlist
          pacman -Syuu --noconfirm --needed git jq mise qt6-declarative quickshell

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          mise trust --yes
          mise install
          echo "$HOME/.local/share/mise/shims" >>"$GITHUB_PATH"

      - name: Mutate the QML
        run: ./scripts/mutate qml
        env:
          QMUTANT_JOBS: 100%
