name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed \
            git jq nodejs shellcheck shfmt qt6-declarative quickshell diffutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch Omarchy
        run: |
          git config --global --add safe.directory '*'
          git clone --depth 1 https://github.com/basecamp/omarchy /opt/omarchy
          echo "OMARCHY_PATH=/opt/omarchy" >>"$GITHUB_ENV"
          echo "/opt/omarchy/bin" >>"$GITHUB_PATH"

      - name: Format (QML)
        run: ./scripts/pre-commit qml-format
      - name: Format (shell)
        if: ${{ !cancelled() }}
        run: ./scripts/pre-commit shell-format
      - name: Lint (shell)
        if: ${{ !cancelled() }}
        run: ./scripts/pre-commit shell-lint
      - name: Lint (QML)
        if: ${{ !cancelled() }}
        run: ./scripts/pre-commit qml-lint
      - name: Manifest
        if: ${{ !cancelled() }}
        run: ./scripts/pre-commit manifest
      - name: Unit tests and coverage
        if: ${{ !cancelled() }}
        run: ./scripts/pre-commit unit
      - name: Shell and provider tests
        if: ${{ !cancelled() }}
        run: ./scripts/pre-commit shell-tests

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check every commit on the branch
        run: |
          set -uo pipefail
          git fetch --quiet origin "$BASE"
          failed=0
          for sha in $(git rev-list "origin/$BASE..HEAD"); do
            git log -1 --pretty=%B "$sha" >/tmp/msg
            ./scripts/commit-msg /tmp/msg || {
              echo "::error::$(git log -1 --pretty='%h %s' "$sha")"
              failed=1
            }
          done
          exit "$failed"
        env:
          BASE: ${{ github.base_ref }}

  branch:
    name: Branch and version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Only release and hotfix branches may reach main
        if: github.base_ref == 'main'
        run: |
          case "$HEAD" in
          release/* | hotfix/*) echo "$HEAD may merge into main" ;;
          *)
            echo "::error::only release/* and hotfix/* may merge into main, got '$HEAD'"
            exit 1
            ;;
          esac
        env:
          HEAD: ${{ github.head_ref }}

      - name: Only release and hotfix branches may change the version
        if: ${{ github.head_ref != 'main' && !startsWith(github.head_ref, 'release/') && !startsWith(github.head_ref, 'hotfix/') }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BASE"
          if git diff "origin/$BASE...HEAD" -- manifest.json |
            grep -qE '^[-+][[:space:]]*"version"'; then
            echo "::error::the version may only change on release/* or hotfix/*"
            exit 1
          fi
        env:
          BASE: ${{ github.base_ref }}

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The tag must match the manifest
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(jq -r '.version' manifest.json)
          [ "$tag" = "$version" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          }

      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          args: --latest --strip header
        env:
          OUTPUT: /tmp/notes.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: /tmp/notes.md

  back-merge:
    name: Back-merge to develop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Merge main into develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --quiet origin develop main

          if git merge-base --is-ancestor origin/main origin/develop; then
            echo 'develop already contains main'
            exit 0
          fi

          git checkout -B develop origin/develop
          if git merge --no-ff origin/main -m "Merge branch 'main' into develop"; then
            git push origin develop
            exit 0
          fi

          git merge --abort
          branch="chore/back-merge-${GITHUB_SHA::7}"
          git checkout -B "$branch" origin/main
          git push --force origin "$branch"
          gh pr create --base develop --head "$branch" \
            --title 'chore: back-merge main into develop' \
            --body 'The automatic back-merge conflicted. Resolve it here and merge with a merge commit.'
          echo "::error::back-merge conflicted; resolve $branch"
          exit 1
